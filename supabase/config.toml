[project]
id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true

# Cron jobs — configure in Supabase Dashboard > Edge Functions > Schedules
# auto-update-shipments: "0 8 * * *"   (daily 08:00 UTC)
# cleanup-tasks:         "0 2 * * 0"   (weekly Sunday 02:00 UTC)
